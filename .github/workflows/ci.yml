name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          npm i -g corepack@latest
          corepack enable pnpm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm i
      - run: pnpm typecheck
      - run: pnpm lint
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          npm i -g corepack@latest
          corepack enable pnpm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm i
      - run: pnpm build
      - run: pnpm test --coverage --project '*:unit' --project '*:integration'
  e2e-shard:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          npm i -g corepack@latest
          corepack enable pnpm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm i
      - run: pnpm --filter @repo/e2e exec playwright install --with-deps chromium
      - run: pnpm --filter @repo/e2e e2e --shard=${{ matrix.shard }}/6 --reporter=list,blob
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: blob-report-${{ matrix.shard }}
          path: e2e/blob-report
  e2e:
    needs: e2e-shard
    if: always()
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          npm i -g corepack@latest
          corepack enable pnpm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm i
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: blob-report-*
          path: e2e/blob-report
          merge-multiple: true
      - run: pnpm --filter @repo/e2e exec playwright merge-reports --reporter html ./blob-report
      - name: Upload Report
        if: always() && (github.ref == 'refs/heads/main' || github.actor == 'mkizka')
        run: |
          REPORT_S3_PATH="${{ github.ref == 'refs/heads/main' && 'main/e2e' || format('pr/e2e/{0}', github.sha) }}"
          aws s3 cp e2e/playwright-report "s3://subscope/$REPORT_S3_PATH" --recursive
          echo "REPORT_URL=${{ vars.S3_BASE_URL }}/$REPORT_S3_PATH/index.html" >> $GITHUB_ENV
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
          AWS_DEFAULT_REGION: auto
      - name: Comment on PR
        if: always() && github.ref != 'refs/heads/main' && github.actor == 'mkizka'
        run: |
          MARKER="<!-- e2e-report -->"
          BODY="$MARKER
          ## E2E Report
          📊 [View Report]($REPORT_URL)"
          COMMENT_ID=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.number }}/comments" \
            --paginate --jq "[.[] | select(.body | startswith(\"$MARKER\"))][-1].id // empty")
          if [ -n "$COMMENT_ID" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$COMMENT_ID" -f body="$BODY"
          else
            gh pr comment ${{ github.event.number }} --body "$BODY"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: needs.e2e-shard.result != 'success'
        run: exit 1
  vrt:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
      AWS_DEFAULT_REGION: auto
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          npm i -g corepack@latest
          corepack enable pnpm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm i
      - run: pnpm --filter @repo/e2e exec playwright install --with-deps chromium
      - name: Download baseline
        if: github.ref != 'refs/heads/main' && github.actor == 'mkizka'
        run: aws s3 sync s3://subscope/main/vrt e2e/baseline
      - name: Run VRT
        run: pnpm --filter @repo/e2e vrt ${{ github.ref == 'refs/heads/main' && '--update-snapshots=all' || '' }} || true
      - name: Upload baseline
        if: github.ref == 'refs/heads/main'
        run: aws s3 sync e2e/baseline s3://subscope/main/vrt --delete
      - name: Upload Report
        if: github.ref != 'refs/heads/main' && github.actor == 'mkizka'
        run: aws s3 sync e2e/playwright-report "s3://subscope/pr/${{ github.event.number }}/vrt" --delete
      - name: Comment on PR
        if: github.ref != 'refs/heads/main' && github.actor == 'mkizka'
        run: |
          MARKER="<!-- vrt -->"
          FAILED=$(jq -r '[.. | objects | select(has("specs")) | .specs[] | .title as $t | .tests[] | select(.status == "unexpected") | "- `\($t)` (\(.projectName))"] | unique | .[]' e2e/test-results/vrt.json)
          if [ -n "$FAILED" ]; then
            RESULT="⚠️ 差分あり: $(echo "$FAILED" | wc -l)件
          $FAILED"
          else
            RESULT="✅ 差分なし"
          fi
          BODY="$MARKER
          ## VRT
          $RESULT

          🖼️ [View Diff](${{ vars.S3_BASE_URL }}/pr/${{ github.event.number }}/vrt/index.html)"
          COMMENT_ID=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.number }}/comments" \
            --paginate --jq "[.[] | select(.body | startswith(\"$MARKER\"))][-1].id // empty")
          if [ -n "$COMMENT_ID" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$COMMENT_ID" -f body="$BODY"
          else
            gh pr comment ${{ github.event.number }} --body "$BODY"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  storybook:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          npm i -g corepack@latest
          corepack enable pnpm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm i
      - run: pnpm --filter @repo/web exec playwright install --with-deps chromium
      - run: pnpm test run --project 'web:storybook'
      - run: pnpm --filter @repo/web exec storybook build
      - name: Upload Storybook
        if: github.ref == 'refs/heads/main' || github.actor == 'mkizka'
        run: |
          STORYBOOK_S3_PATH="${{ github.ref == 'refs/heads/main' && 'main/storybook' || format('pr/{0}/storybook', github.event.number) }}"
          aws s3 cp apps/web/storybook-static "s3://subscope/$STORYBOOK_S3_PATH" --recursive
          echo "STORYBOOK_URL=${{ vars.S3_BASE_URL }}/$STORYBOOK_S3_PATH/index.html" >> $GITHUB_ENV
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
          AWS_DEFAULT_REGION: auto
      - name: Comment on PR
        if: github.ref != 'refs/heads/main' && github.actor == 'mkizka'
        run: |
          MARKER="<!-- storybook -->"
          BODY="$MARKER
          ## Storybook
          📚 [View Storybook]($STORYBOOK_URL)"
          COMMENT_ID=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.number }}/comments" \
            --paginate --jq "[.[] | select(.body | startswith(\"$MARKER\"))][-1].id // empty")
          if [ -n "$COMMENT_ID" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$COMMENT_ID" -f body="$BODY"
          else
            gh pr comment ${{ github.event.number }} --body "$BODY"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
