name: Lexicon

on:
  push:
    branches:
      - main
    paths:
      - packages/client/lexicons/me/subsco/**
      - .github/workflows/lexicon.yml
  pull_request:
    paths:
      - packages/client/lexicons/me/subsco/**
      - .github/workflows/lexicon.yml

jobs:
  lex-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mkizka/lex-publish@03dd5b49b8431075716df7226efb642aa2d30b36 # v2.0.1
        with:
          paths: packages/client/lexicons/me/subsco/authFull.json
          lint: false
          publish: ${{ github.ref == 'refs/heads/main' }}
          username: ${{ secrets.GOAT_USERNAME }}
          password: ${{ secrets.GOAT_PASSWORD }}
