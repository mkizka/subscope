name: Conflict label

on:
  push:
    branches:
      - main
  pull_request_target:
    types: [synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: eps1lon/actions-label-merge-conflict@0273be72a0bbd58fcd71d0d6c02c209b50d1e5e1 # v3.1.0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          dirtyLabel: conflict
          commentOnDirty: mainとコンフリクトしています。mainを取り込んで解消してください。
