packages:
  - apps/*
  - packages/*
  - e2e
minimumReleaseAgeExclude:
  - "@gyaku/di"
allowBuilds:
  better-sqlite3: true
  core-js: false
  cpu-features: false
  esbuild: false
  msgpackr-extract: false
  msw: false
  protobufjs: false
  sharp: false
  ssh2: false
patchedDependencies:
  "@atproto/oauth-scopes": patches/@atproto__oauth-scopes.patch
  "@factory-js/factory": patches/@factory-js__factory.patch
